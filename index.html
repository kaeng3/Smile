<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김일청의 양음양 & 포도시 주식 리포트 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 49, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #ff4d4d;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
        }


        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 16px 0;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .date-section {
            margin-bottom: 20px;
        }

        .date-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .date-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .date-chip {
            padding: 8px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .date-chip.active {
            background: rgba(139, 92, 246, 0.25);
            color: #c7d2fe;
            border-color: rgba(139, 92, 246, 0.6);
        }

        .strategy-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            min-width: 0;
            padding: 10px 6px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: -0.4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }


        .report-download-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .pdf-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .pdf-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: #10b981;
            color: white;
            font-weight: 700;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .download-btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .stock-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .stock-card:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.2);
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .stock-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .stock-code {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .stock-rate {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .rate-up { color: var(--accent-red); }
        .rate-down { color: var(--accent-blue); }

        .stock-pattern {
            display: inline-block;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #c7d2fe;
            margin-bottom: 8px;
        }

        .stock-comment {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f3f4f6;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 📰 과거 뉴스 타임라인 모달 스타일 */

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #111827;
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            animation: modalUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #f3f4f6;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .timeline-item {
            position: relative;
            padding-left: 20px;
            margin-bottom: 20px;
            border-left: 2px solid rgba(139, 92, 246, 0.4);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8b5cf6;
            box-shadow: 0 0 10px #8b5cf6;
        }

        .timeline-date {
            font-size: 0.8rem;
            font-weight: 700;
            color: #a78bfa;
            margin-bottom: 4px;
        }

        .timeline-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .timeline-text {
            font-size: 0.83rem;
            color: #9ca3af;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            .strategy-tabs { gap: 4px; }
            .tab-btn {
                padding: 9px 2px;
                font-size: 0.75rem;
                letter-spacing: -0.6px;
                border-radius: 10px;
            }
            .report-download-card { flex-direction: column; gap: 10px; align-items: flex-start; }
            .download-btn { width: 100%; justify-content: center; }
            .modal-content { max-height: 90vh; }
        }
    </style>


</head>
<body>
    <div class="container">
        <header>
            <div class="badge">최근 5일 자동 스캔 보관</div>
            <h1>김일청의 양음양 & 포도시 리포트</h1>
            <p class="subtitle">매일 장마감 후 세력 수급 및 이동평균선 지지 타점 자동 분석</p>
        </header>

        <div class="date-section">
            <div class="date-title">📅 날짜 선택 (최근 5영업일)</div>
            <div class="date-chips" id="date-chips">
                <!-- Dynamic Date Chips -->
            </div>
        </div>

        <div class="strategy-tabs">
            <button class="tab-btn active" onclick="switchStrategy('yey')">🔥 양음양 기법</button>
            <button class="tab-btn" onclick="switchStrategy('v2')">⚡ 양음양 v2전략</button>
            <button class="tab-btn" onclick="switchStrategy('podosi')">🍇 포도시 차트</button>
            <button class="tab-btn" onclick="switchStrategy('b500m')">💰 500억/150억 기준봉</button>
        </div>

        <div class="report-download-card" id="download-card">
            <div>
                <div class="pdf-title" id="pdf-title-text">김일청의 양음양 기법 PDF 리포트</div>
                <div class="pdf-sub" id="pdf-sub-text">고화질 차트 및 AI 종목별 실전 대응 전략 수록</div>
            </div>
            <a href="김일청의_양음양기법_20260804.pdf" id="pdf-download-link" class="download-btn" target="_blank">
                📥 PDF 다운로드
            </a>
        </div>

        <div class="stock-grid" id="stock-grid">
            <!-- Dynamic Stock Cards -->
        </div>

        <footer>
            <p>© 2026 김일청의 주식 연구소. All rights reserved.</p>
            <p style="margin-top: 4px; opacity: 0.7;">매일 평일 15:40 자동 스캔 & 5일분 롤링 보관 시스템</p>
        </footer>
    </div>

    <script>
        let currentStrategy = 'yey';
        let availableDates = [];
        let selectedDate = '';
        let historyData = {};

        loadData();

        function renderDateChips() {
            const container = document.getElementById('date-chips');
            container.innerHTML = availableDates.map((d, idx) => {
                const formatted = `${d.substring(0,4)}.${d.substring(4,6)}.${d.substring(6,8)}`;
                const label = idx === 0 ? `📅 ${formatted} (최신)` : `📅 ${formatted}`;
                const activeClass = d === selectedDate ? 'active' : '';
                return `<div class="date-chip ${activeClass}" onclick="selectDate('${d}')">${label}</div>`;
            }).join('');
        }

        function selectDate(d) {
            selectedDate = d;
            renderDateChips();
            renderStrategy();
        }

        function switchStrategy(strat) {
            currentStrategy = strat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (strat === 'yey') document.querySelectorAll('.tab-btn')[0].classList.add('active');
            if (strat === 'v2') document.querySelectorAll('.tab-btn')[1].classList.add('active');
            if (strat === 'podosi') document.querySelectorAll('.tab-btn')[2].classList.add('active');
            if (strat === 'b500m') document.querySelectorAll('.tab-btn')[3].classList.add('active');

            renderStrategy();
        }

        function renderStrategy() {
            const grid = document.getElementById('stock-grid');
            const pdfLink = document.getElementById('pdf-download-link');
            const pdfTitle = document.getElementById('pdf-title-text');
            const pdfSub = document.getElementById('pdf-sub-text');

            let titleMap = {
                yey: '김일청의 양음양 기법 PDF 리포트',
                v2: '김일청의 양음양 v2전략 PDF 리포트',
                podosi: '김일청의 포도시 차트 기법 PDF 리포트',
                b500m: '김일청의 500억/150억 기준봉 분석 리포트'
            };

            let pdfFileMap = {
                yey: `김일청의_양음양기법_${selectedDate}.pdf`,
                v2: `김일청의_양음양기법_v2전략_${selectedDate}.pdf`,
                podosi: `김일청의_포도시차트_${selectedDate}.pdf`,
                b500m: `김일청의_양음양기법_${selectedDate}.pdf`
            };


            pdfTitle.innerText = `${titleMap[currentStrategy]} (${selectedDate})`;
            pdfSub.innerText = `${selectedDate}자 고화질 차트 및 AI 실전 대응 전략 수록`;
            pdfLink.href = pdfFileMap[currentStrategy] || '#';

            const dayData = historyData[selectedDate] || {};
            const list = dayData[currentStrategy] || [];

            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-sub);">해당 날짜의 포착 종목 데이터가 없거나 수록 준비 중입니다.</div>';
                return;
            }

            grid.innerHTML = list.map(s => {
                const isUp = (s.rate || 0) >= 0;
                const rateClass = isUp ? 'rate-up' : 'rate-down';
                const rateSign = isUp ? '+' : '';
                const themeBadge = s.detail_theme
                    ? `<div style="font-size:0.75rem; color:#a78bfa; font-weight:700; margin-bottom:4px;">🏷️ ${s.detail_theme}</div>`
                    : '';
                const chartHtml = s.chart
                    ? `<img src="${s.chart}" alt="${s.name} 차트" style="width:100%;border-radius:10px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.08);">`
                    : '';
                return `
                    <div class="stock-card" onclick="openNewsModal('${s.code}', '${s.name}')">
                        <div class="stock-header">
                            <div>
                                <div class="stock-name">${s.name}</div>
                                <div class="stock-code">${s.code}</div>
                            </div>
                            <div class="stock-rate ${rateClass}">${rateSign}${(s.rate || 0).toFixed(2)}%</div>
                        </div>
                        ${themeBadge}
                        <div class="stock-pattern">${s.pattern || '상승 타점 포착'}</div>
                        ${chartHtml}
                        <div class="stock-comment">${s.comment || s.result_desc || '5일선 및 20일선 지지 흐름 점검'}</div>
                    </div>
                `;
            }).join('');
        }

        let newsHistoryDB = {};

        async function loadData() {
            try {
                const res = await fetch('scan_history.json?t=' + Date.now());
                if (res.ok) {
                    historyData = await res.json();
                    availableDates = Object.keys(historyData).sort().reverse().slice(0, 5);
                }
            } catch (e) {
                console.error("scan_history.json 로딩 실패:", e);
            }

            try {
                const resNews = await fetch('stock_news_history.json?t=' + Date.now());
                if (resNews.ok) {
                    newsHistoryDB = await resNews.json();
                }
            } catch (e) {
                console.error("stock_news_history.json 로딩 실패:", e);
            }

            if (availableDates.length > 0) {
                selectedDate = availableDates[0];
            }

            renderDateChips();
            renderStrategy();
        }

        // 📰 뉴스 타임라인 모달 오픈 & 모바일 뒤로가기 지원
        function openNewsModal(code, name) {
            const overlay = document.getElementById('news-modal-overlay');
            const titleEl = document.getElementById('modal-stock-title');
            const bodyEl = document.getElementById('modal-news-body');

            titleEl.innerText = `📰 ${name} (${code}) 과거 이브닝 뉴스 히스토리`;

            const list = newsHistoryDB[code] || [];

            if (list.length === 0) {
                bodyEl.innerHTML = `
                    <div style="text-align:center; padding:40px; color:var(--text-sub);">
                        <div style="font-size:1.8rem; margin-bottom:10px;">🔍</div>
                        등록된 과거 이브닝 호재/뉴스 데이터가 없습니다.
                    </div>`;
            } else {
                bodyEl.innerHTML = list.map(item => `
                    <div class="timeline-item">
                        <div class="timeline-date">📅 ${item.date} ${item.rate ? '('+item.rate+')' : ''}</div>
                        <div class="timeline-title">${item.title}</div>
                        <div class="timeline-text">${item.content}</div>
                    </div>
                `).join('');
            }

            overlay.classList.add('active');

            // 스마트폰 뒤로가기 지원
            history.pushState({ modalOpen: true }, '');
        }

        function closeNewsModal() {
            const overlay = document.getElementById('news-modal-overlay');
            if (overlay.classList.contains('active')) {
                overlay.classList.remove('active');
            }
        }

        // 스마트폰 뒤로가기(popstate) 이벤트 감지
        window.addEventListener('popstate', (e) => {
            closeNewsModal();
        });
    </script>

    <!-- 📰 과거 뉴스 타임라인 모달 팝업 -->
    <div class="modal-overlay" id="news-modal-overlay" onclick="if(event.target===this) history.back();">
        <div class="modal-content">
            <div class="modal-header">
                <button class="modal-back-btn" onclick="history.back();">← 뒤로가기</button>
                <div class="modal-title" id="modal-stock-title">📰 종목 뉴스 히스토리</div>
            </div>
            <div class="modal-body" id="modal-news-body">
                <!-- Dynamic Timeline Items -->
            </div>
        </div>
    </div>
</body>
</html>
