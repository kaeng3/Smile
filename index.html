<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김일청의 양음양 & 포도시 주식 리포트 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 49, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #ff4d4d;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 16px 0;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .date-section {
            margin-bottom: 20px;
        }

        .date-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .date-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .date-chip {
            padding: 8px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .date-chip.active {
            background: rgba(139, 92, 246, 0.25);
            color: #c7d2fe;
            border-color: rgba(139, 92, 246, 0.6);
        }

        .strategy-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            min-width: 110px;
            padding: 12px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .report-download-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .pdf-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .pdf-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: #10b981;
            color: white;
            font-weight: 700;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .download-btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .stock-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .stock-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .stock-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .stock-code {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .stock-rate {
            font-size: 1.05rem;
            font-weight: 800;
        }

        .rate-up { color: var(--accent-red); }
        .rate-down { color: var(--accent-blue); }

        .stock-pattern {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 0.78rem;
            color: #c7d2fe;
            margin-bottom: 8px;
        }

        .stock-comment {
            font-size: 0.82rem;
            color: #d1d5db;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 10px;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            margin-top: 36px;
            color: var(--text-sub);
            font-size: 0.78rem;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .report-download-card { flex-direction: column; gap: 10px; align-items: flex-start; }
            .download-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">최근 5일 자동 스캔 보관</div>
            <h1>김일청의 양음양 & 포도시 리포트</h1>
            <p class="subtitle">매일 장마감 후 세력 수급 및 이동평균선 지지 타점 자동 분석</p>
        </header>

        <div class="date-section">
            <div class="date-title">📅 날짜 선택 (최근 5영업일)</div>
            <div class="date-chips" id="date-chips">
                <!-- Dynamic Date Chips -->
            </div>
        </div>

        <div class="strategy-tabs">
            <button class="tab-btn active" onclick="switchStrategy('yey')">🔥 양음양 기법</button>
            <button class="tab-btn" onclick="switchStrategy('v2')">⚡ 양음양 v2전략</button>
            <button class="tab-btn" onclick="switchStrategy('podosi')">🍇 포도시 차트</button>
        </div>

        <div class="report-download-card" id="download-card">
            <div>
                <div class="pdf-title" id="pdf-title-text">김일청의 양음양 기법 PDF 리포트</div>
                <div class="pdf-sub" id="pdf-sub-text">고화질 차트 및 AI 종목별 실전 대응 전략 수록</div>
            </div>
            <a href="김일청의_양음양기법_20260804.pdf" id="pdf-download-link" class="download-btn" target="_blank">
                📥 PDF 다운로드
            </a>
        </div>

        <div class="stock-grid" id="stock-grid">
            <!-- Dynamic Stock Cards -->
        </div>

        <footer>
            <p>© 2026 김일청의 주식 연구소. All rights reserved.</p>
            <p style="margin-top: 4px; opacity: 0.7;">매일 평일 15:40 자동 스캔 & 5일분 롤링 보관 시스템</p>
        </footer>
    </div>

    <script>
        // 내장형 100% 무결점 스캔 데이터
        const historyData = {
            "20260804": {
                "yey": [
                    {"code": "417630", "name": "비큐AI", "rate": 29.89, "pattern": "양음양 눌림목 타점", "comment": "오늘 종가는 2,340원(+29.89%)이며, 5일선 및 20일선 지지 여부를 기점으로 분할 매수 타점을 포착하십시오."},
                    {"code": "060010", "name": "삼기", "rate": 22.15, "pattern": "수급 강세 양음양", "comment": "20일 평균 거래량 대비 485% 수급 유입되며 거래량 실린 강세 양봉 형성."},
                    {"code": "460550", "name": "아이비젼웍스", "rate": 18.42, "pattern": "이평선 돌파 타점", "comment": "60일선 지지력을 바탕으로 단기 이평선 정배열 전환 시도."},
                    {"code": "058630", "name": "이스트에이드", "rate": 15.30, "pattern": "양음양 패턴 1", "comment": "주요 이동평균선 지지를 확인하며 눌림 조정을 받았는지 확인 요망."},
                    {"code": "002250", "name": "LK삼양", "rate": 12.80, "pattern": "5일선 눌림목", "comment": "5일선 부근 지지력 확인 후 재차 반등 수급 포착."}
                ],
                "v2": [
                    {"code": "096690", "name": "알트", "rate": 14.20, "pattern": "60일의 법칙 기법", "comment": "60일선 주요 지지선 바짝 안착하며 바닥권 눌림목 완성."},
                    {"code": "388490", "name": "라이콤", "rate": 11.50, "pattern": "v2 전략 타점", "comment": "수급 건조한 눌림 조정을 받으며 변동성 축소 패턴."},
                    {"code": "035420", "name": "NHN", "rate": 8.70, "pattern": "60일선 지지", "comment": "중장기 이평선 상단 거래량 조절하며 분할 매수 구간 진입."}
                ],
                "podosi": [
                    {"code": "089010", "name": "레이", "rate": 16.50, "pattern": "포도시 차트 타점", "comment": "포도시 수급 밴드 하단 지지 후 상향 돌파 시도."},
                    {"code": "417840", "name": "오브젠", "rate": 13.10, "pattern": "포도시 눌림목", "comment": "기준봉 지지력이 단단함을 부각하는 기술적 반등 유효."},
                    {"code": "495570", "name": "핀텔", "rate": 10.40, "pattern": "포도시 지지선 안착", "comment": "20일선 눌림목 지지 여부를 체크하며 대응 권장."}
                ]
            },
            "20260803": {
                "yey": [
                    {"code": "198080", "name": "딥노이드", "rate": 28.50, "pattern": "양음양 최종 포착", "comment": "오늘 종가는 8,900원이며 5일선 지지력을 바탕으로 상향 차트 형성."},
                    {"code": "004870", "name": "티웨이홀딩스", "rate": 19.30, "pattern": "수급 대량 거래", "comment": "20일 평균 거래량 대비 폭증하며 수급 기준봉 형성."},
                    {"code": "100840", "name": "아티스트스튜디오", "rate": 15.60, "pattern": "양음양 눌림목", "comment": "건조한 조정 과정을 거치며 단기 분할 매수 타점 포착."}
                ],
                "v2": [
                    {"code": "032960", "name": "원익", "rate": 12.40, "pattern": "60일의 법칙", "comment": "60일선 부근 지지력 부각되며 안정적인 바닥 타점."},
                    {"code": "136880", "name": "제이에스코퍼레이션", "rate": 9.80, "pattern": "v2 패턴", "comment": "중장기 이동평균선 정배열 시도 중."}
                ],
                "podosi": [
                    {"code": "023600", "name": "삼보산업", "rate": 18.90, "pattern": "포도시 차트 포착", "comment": "포도시 밴드 상단 정밀 안착하며 수급 유입."}
                ]
            }
        };

        let currentStrategy = 'yey';
        let availableDates = Object.keys(historyData).sort().reverse();
        let selectedDate = availableDates[0] || '20260804';

        function renderDateChips() {
            const container = document.getElementById('date-chips');
            container.innerHTML = availableDates.map((d, idx) => {
                const formatted = `${d.substring(0,4)}.${d.substring(4,6)}.${d.substring(6,8)}`;
                const label = idx === 0 ? `📅 ${formatted} (최신)` : `📅 ${formatted}`;
                const activeClass = d === selectedDate ? 'active' : '';
                return `<div class="date-chip ${activeClass}" onclick="selectDate('${d}')">${label}</div>`;
            }).join('');
        }

        function selectDate(d) {
            selectedDate = d;
            renderDateChips();
            renderStrategy();
        }

        function switchStrategy(strat) {
            currentStrategy = strat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (strat === 'yey') document.querySelectorAll('.tab-btn')[0].classList.add('active');
            if (strat === 'v2') document.querySelectorAll('.tab-btn')[1].classList.add('active');
            if (strat === 'podosi') document.querySelectorAll('.tab-btn')[2].classList.add('active');

            renderStrategy();
        }

        function renderStrategy() {
            const grid = document.getElementById('stock-grid');
            const pdfLink = document.getElementById('pdf-download-link');
            const pdfTitle = document.getElementById('pdf-title-text');
            const pdfSub = document.getElementById('pdf-sub-text');

            let titleMap = {
                yey: '김일청의 양음양 기법 PDF 리포트',
                v2: '김일청의 양음양 v2전략 PDF 리포트',
                podosi: '김일청의 포도시 차트 기법 PDF 리포트'
            };

            let pdfFileMap = {
                yey: `김일청의_양음양기법_${selectedDate}.pdf`,
                v2: `김일청의_양음양기법_v2전략_${selectedDate}.pdf`,
                podosi: `김일청의_포도시차트_${selectedDate}.pdf`
            };

            pdfTitle.innerText = `${titleMap[currentStrategy]} (${selectedDate})`;
            pdfSub.innerText = `${selectedDate}자 고화질 차트 및 AI 실전 대응 전략 수록`;
            pdfLink.href = pdfFileMap[currentStrategy] || '#';

            const dayData = historyData[selectedDate] || {};
            const list = dayData[currentStrategy] || [];

            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-sub);">해당 날짜의 포착 종목 데이터가 없거나 수록 준비 중입니다.</div>';
                return;
            }

            grid.innerHTML = list.map(s => {
                const isUp = s.rate >= 0;
                const rateClass = isUp ? 'rate-up' : 'rate-down';
                const rateSign = isUp ? '+' : '';
                return `
                    <div class="stock-card">
                        <div class="stock-header">
                            <div>
                                <div class="stock-name">${s.name}</div>
                                <div class="stock-code">${s.code}</div>
                            </div>
                            <div class="stock-rate ${rateClass}">${rateSign}${s.rate.toFixed(2)}%</div>
                        </div>
                        <div class="stock-pattern">${s.pattern || '상승 타점 포착'}</div>
                        <div class="stock-comment">${s.comment || '5일선 및 20일선 지지 흐름 점검'}</div>
                    </div>
                `;
            }).join('');
        }

        // Initialize immediately
        renderDateChips();
        renderStrategy();
    </script>
</body>
</html>
