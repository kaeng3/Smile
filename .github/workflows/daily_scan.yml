name: Daily Cloud Stock Scan & Deploy

on:
  schedule:
    # 한국시간(KST) 매일 평일 15:45 = UTC 06:45 (월~금)
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cloud_scan_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          pip install requests pandas finance-datareader google-generativeai matplotlib reportlab

      - name: Compute cache date key
        run: echo "TODAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Restore stock OHLCV cache DB
        uses: actions/cache@v4
        with:
          path: cloud_scanner/stock_ohlcv_cache.db
          key: stock-db-${{ env.TODAY }}
          restore-keys: |
            stock-db-

      - name: Seed cache DB if missing (first run)
        run: |
          if [ ! -f cloud_scanner/stock_ohlcv_cache.db ]; then
            echo "캐시가 없어 초기 시드 DB(db-seed 브랜치)를 내려받습니다."
            curl -fL -o cloud_scanner/stock_ohlcv_cache.db "https://raw.githubusercontent.com/kaeng3/Smile/db-seed/stock_ohlcv_cache.db"
          else
            echo "캐시된 DB 사용 (크기: $(du -h cloud_scanner/stock_ohlcv_cache.db | cut -f1))"
          fi

      - name: Run Cloud Stock Scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_cloud_scan.py

      - name: Commit and Push Changes if Any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Cloud Scan: $(date +'%Y-%m-%d')" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
