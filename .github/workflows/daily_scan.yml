name: Daily Stock Scan & GitHub Pages Automation

on:
  schedule:
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install System Fonts & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-nanum
        python -m pip install --upgrade pip
        pip install FinanceDataReader reportlab pandas matplotlib requests

    - name: Execute Daily Scan & PDF Generation
      run: |
        python run_simple_cloud.py

    - name: Commit and Push Updated Reports
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "Auto Update: Daily Stock Reports [$(date +'%Y-%m-%d')]" || exit 0
        git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
