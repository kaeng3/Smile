name: Daily Cloud Stock Scan & Deploy

on:
  schedule:
    # 한국시간(KST) 매일 평일 15:40 = UTC 06:40 (월~금)
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cloud_scan_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Cloud Stock Scan
        run: |
          python run_cloud_scan.py

      - name: Commit and Push Changes if Any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add scan_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Cloud Scan: $(date +'%Y-%m-%d')" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
