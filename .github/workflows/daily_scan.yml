name: Daily Cloud Stock Scan & Deploy

on:
  schedule:
    # 한국시간(KST) 매일 평일 15:45 = UTC 06:45 (월~금)
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cloud_scan_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore generated data (data 브랜치)
        id: pull
        run: python data_store.py pull

      - name: Restore permanent archive (archive 브랜치)
        id: archive_pull
        run: python archive_store.py pull

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          pip install requests pandas finance-datareader google-generativeai matplotlib reportlab exchange-calendars==4.13.2

      - name: Compute cache date key
        run: echo "TODAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Restore stock OHLCV cache DB
        # 복원과 저장을 나눈다: 예전엔 job이 끝날 때 저장돼서, 배포가 실패하면 그날 DB가 캐시에 안 남아
        # 뒤이은 김일구 스캐너가 전날 DB로 돌다 'no fresh market data'로 같이 실패했음
        uses: actions/cache/restore@v4
        with:
          path: cloud_scanner/stock_ohlcv_cache.db
          key: stock-db-${{ env.TODAY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-db-

      - name: Seed cache DB if missing (first run)
        run: |
          if [ ! -f cloud_scanner/stock_ohlcv_cache.db ]; then
            echo "캐시가 없어 초기 시드 DB(db-seed 브랜치)를 내려받습니다."
            curl -fL -o cloud_scanner/stock_ohlcv_cache.db "https://raw.githubusercontent.com/kaeng3/Smile/db-seed/stock_ohlcv_cache.db"
          else
            echo "캐시된 DB 사용 (크기: $(du -h cloud_scanner/stock_ohlcv_cache.db | cut -f1))"
          fi

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run Cloud Stock Scan
        id: scan
        env:
          GEMINI_API_KEY: ${{ secrets.SMILE }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python run_cloud_scan.py

      - name: Save stock OHLCV cache DB (스캔 직후 저장, 배포 성공 여부와 무관)
        if: always() && steps.scan.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: cloud_scanner/stock_ohlcv_cache.db
          key: stock-db-${{ env.TODAY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload scan failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-failure-log
          path: debug_scan_error.txt
          if-no-files-found: ignore

      - name: Save generated data (data 브랜치)
        # 스캔이 실패해도 오류 기록(debug_scan_error.txt)을 남기도록 always. 단, 데이터를 받지 못한 실행은 올리지 않음
        if: always() && steps.pull.outcome == 'success'
        run: python data_store.py push daily

      - name: Save permanent archive (archive 브랜치, 이력 보존)
        if: always() && steps.archive_pull.outcome == 'success'
        run: python archive_store.py push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build clean Pages artifact
        # main 코드 + data 브랜치 데이터를 합치고 종목별 뉴스(news/)를 만든다(원본 81MB는 제외)
        run: python data_store.py site "$RUNNER_TEMP/site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying deploy (GitHub 일시 장애 대비)
        if: steps.deployment.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
