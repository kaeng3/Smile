name: Redeploy Only (no scan)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-redeploy-only"
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build clean Pages artifact
        # main 코드 + data 브랜치 데이터를 합치고 종목별 뉴스(news/)를 만든다(원본 81MB는 제외)
        run: python3 data_store.py site "$RUNNER_TEMP/site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
