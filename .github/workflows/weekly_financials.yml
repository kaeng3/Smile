name: Weekly Financials Fetch (Naver)

on:
  schedule:
    # 매주 일요일 10:00 KST = UTC 일요일 01:00 (장 안 여는 날, 여유롭게)
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_financials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore generated data (data 브랜치)
        id: pull
        run: python data_store.py pull

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch Naver Finance Financials
        run: |
          python fetch_naver_financials.py

      - name: Save generated data (data 브랜치)
        run: python data_store.py push weekly
