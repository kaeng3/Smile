name: Kim Ilgu New Scanner

on:
  schedule:
    # 15:55 KST, Monday through Friday
    - cron: '55 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r new_scanner/requirements.txt pytest

      - name: Restore scanner cache and notification state
        uses: actions/cache@v4
        with:
          path: |
            new_scanner/data/cache
            new_scanner/state
          key: new-scanner-${{ runner.os }}-${{ hashFiles('new_scanner/config/scanner.yaml') }}-${{ github.run_id }}
          restore-keys: |
            new-scanner-${{ runner.os }}-${{ hashFiles('new_scanner/config/scanner.yaml') }}-

      - name: Run site regression tests
        run: python -m unittest discover -s tests -v

      - name: Run scanner regression tests
        working-directory: new_scanner
        run: python -m pytest tests -q

      - name: Run daily scanner
        working-directory: new_scanner
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily.py

      - name: Commit scanner history when changed
        id: changes
        shell: bash
        run: |
          git add new_scanner/results/history.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Auto New Scanner: $(date -u +'%Y-%m-%d')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
