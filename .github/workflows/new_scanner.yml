name: Kim Ilgu New Scanner
on:
  schedule:
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/new_scanner/src
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r new_scanner/requirements.txt pytest exchange-calendars==4.13.2
      - name: Restore scanner cache and notification state
        uses: actions/cache/restore@v4
        with:
          path: |
            new_scanner/data/cache
            new_scanner/state
          key: new-scanner-${{ runner.os }}-${{ hashFiles('new_scanner/config/scanner.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: new-scanner-${{ runner.os }}-${{ hashFiles('new_scanner/config/scanner.yaml') }}-
      - name: Run site regression tests
        run: python -m unittest discover -s tests -v
      - name: Run scanner regression tests
        working-directory: new_scanner
        run: python -m pytest tests -q
      - name: Resolve latest KRX session
        id: session
        run: echo "date=$(python -c "import exchange_calendars as x,pandas as p; print(x.get_calendar('XKRX').date_to_session(p.Timestamp.now(tz='Asia/Seoul').normalize().tz_localize(None),direction='previous').date())")" >> "$GITHUB_OUTPUT"
      - name: Run daily scanner
        working-directory: new_scanner
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python run_daily.py --date "${{ steps.session.outputs.date }}"
          else
            python run_daily.py --no-telegram --date "${{ steps.session.outputs.date }}"
          fi
      - name: Save scanner cache and notification receipt
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            new_scanner/data/cache
            new_scanner/state
          key: new-scanner-${{ runner.os }}-${{ hashFiles('new_scanner/config/scanner.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit scanner history when changed
        id: changes
        run: |
          git add new_scanner/results/history.json
          if git diff --cached --quiet; then exit 0; fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Auto New Scanner: $(date -u +'%Y-%m-%d')"
          git push
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5
      - name: Build clean Pages artifact
        if: always()
        run: mkdir -p "$RUNNER_TEMP/site" && git archive HEAD | tar -x -C "$RUNNER_TEMP/site"
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
