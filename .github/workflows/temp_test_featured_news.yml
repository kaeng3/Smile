name: TEMP Test Featured News

on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Featured News Script (test against 20260807)
        env:
          FEATURED_NEWS_TARGET_DATE: '20260807'
          FEATURED_DEBUG: ${{ github.event.inputs.debug == 'true' && '1' || '0' }}
        run: |
          python cloud_scanner/fetch_featured_stock_news.py

      - name: Commit and Push Changes if Any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add featured_stock_news.json featured_debug.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "TEST: featured news 20260807" && git push)
