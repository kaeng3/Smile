name: TEMP Price Debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader requests

      - name: Compute cache date key
        run: echo "TODAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Restore stock OHLCV cache DB
        uses: actions/cache@v4
        with:
          path: cloud_scanner/stock_ohlcv_cache.db
          key: stock-db-${{ env.TODAY }}
          restore-keys: |
            stock-db-

      - name: Dump price debug
        env:
          PRICE_DEBUG: '1'
        run: |
          cd cloud_scanner
          python local_data_manager.py

      - name: Commit and Push Changes if Any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price_debug.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "TEMP: price debug dump" && git push)
