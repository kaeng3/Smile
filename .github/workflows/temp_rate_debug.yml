name: TEMP Rate Debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader requests

      - name: Compute cache date key
        run: echo "TODAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Restore stock OHLCV cache DB
        uses: actions/cache@v4
        with:
          path: cloud_scanner/stock_ohlcv_cache.db
          key: stock-db-${{ env.TODAY }}
          restore-keys: |
            stock-db-

      - name: Dump rate debug
        run: |
          cd cloud_scanner
          python3 -c "
          import sqlite3, json
          conn = sqlite3.connect('stock_ohlcv_cache.db')
          cur = conn.cursor()
          out = {}
          for code in ['099220','900110','096610']:
              cur.execute('SELECT date, close, volume FROM daily_prices WHERE code=? ORDER BY date DESC LIMIT 15;', (code,))
              out[code] = cur.fetchall()
          cur.execute('SELECT date, COUNT(*) FROM daily_prices GROUP BY date ORDER BY date DESC LIMIT 15;')
          out['_date_counts'] = cur.fetchall()
          conn.close()
          with open('../rate_debug.json','w',encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print('done')
          "

      - name: Commit and Push Changes if Any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rate_debug.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "TEMP: rate debug dump" && git push)
