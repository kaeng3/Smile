name: TEMP Rate Debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader requests

      - name: Compute cache date key
        run: echo "TODAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Restore stock OHLCV cache DB
        uses: actions/cache@v4
        with:
          path: cloud_scanner/stock_ohlcv_cache.db
          key: stock-db-${{ env.TODAY }}
          restore-keys: |
            stock-db-

      - name: Full sync + targeted backfill for 096610
        run: |
          cd cloud_scanner
          python3 local_data_manager.py
          python3 -c "
          import sqlite3, FinanceDataReader as fdr

          code = '096610'
          df = fdr.DataReader(code, '2026-09-03', '2026-09-18')
          print(df)

          conn = sqlite3.connect('stock_ohlcv_cache.db')
          cur = conn.cursor()
          recs = []
          for idx, row in df.iterrows():
              close = float(row.get('Close', 0) or 0)
              if close <= 0:
                  continue
              recs.append((
                  code, idx.strftime('%Y-%m-%d'),
                  float(row.get('Open', close) or close),
                  float(row.get('High', close) or close),
                  float(row.get('Low', close) or close),
                  close,
                  float(row.get('Volume', 0) or 0),
              ))
          cur.executemany('INSERT OR REPLACE INTO daily_prices VALUES (?,?,?,?,?,?,?)', recs)
          conn.commit()
          conn.close()
          print(f'{len(recs)}건 보정 완료')
          "

      - name: Save updated cache under today's key
        uses: actions/cache/save@v4
        with:
          path: cloud_scanner/stock_ohlcv_cache.db
          key: stock-db-${{ env.TODAY }}
