name: Smile 2 isolated verification
on:
  pull_request:
    paths:
      - 'smile2/**'
      - 'tests/test_smile2*.py'
      - 'tests/smile2_browser.cjs'
      - '.github/workflows/smile2_verify.yml'
      - 'news_feed/sources.py'
      - 'news_feed/collect.py'
      - 'data_store.py'
      - '.github/workflows/news_feed.yml'
      - '.github/workflows/redeploy_only.yml'
  workflow_dispatch:
concurrency:
  group: smile2-verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install exchange-calendars==4.13.2
      - name: Syntax and offline tests
        run: |
          python -m compileall -q smile2
          python -m unittest discover -s tests -p 'test_smile2*.py' -v
          node --check smile2/app.js
          node --check smile2/brief.js
          node --check smile2/candidates.js
          node --check smile2/chart.js
          node --check smile2/history.js
          node --check smile2/themes.js
      - name: Aggregate-only existing history audit
        run: python -m smile2.audit_history stock_news_history.json

      - name: Real feed snapshot smoke test (read only)
        run: |
          git fetch --depth=1 origin data
          git show FETCH_HEAD:news_feed/news.json > "$RUNNER_TEMP/news.json"
          python -m smile2.news_engine --input "$RUNNER_TEMP/news.json" --output "$RUNNER_TEMP/events.json"
          python -m smile2.quality --input "$RUNNER_TEMP/events.json" --output "$RUNNER_TEMP/quality.json"
          python -m smile2.briefing --input "$RUNNER_TEMP/news.json" --output "$RUNNER_TEMP/pre.json" --day 2026-11-26 --previous 2026-11-25 --edition pre --calendar
          python -m smile2.briefing --input "$RUNNER_TEMP/news.json" --output "$RUNNER_TEMP/post.json" --day 2026-11-26 --previous 2026-11-25 --edition post --calendar

      - name: Build actual Pages release in temporary directory
        run: |
          python data_store.py site "$RUNNER_TEMP/pages-test"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"pages-test"
          d=json.loads((p/"smile2"/"manifest.json").read_text())
          assert d["calendar_basis"]=="XKRX" and not d["history_included"]
          assert 'id="smile2-entry"' in (p/"index.html").read_text()
          assert not (p/"smile2"/"stock_news_history.json").exists()
          assert not (p/"smile2"/"patterns.py").exists()
          print("Pages release build PASS",d)
          PY
      - name: Validate real dated market observation schema (read only)
        run: |
          python - <<'PY'
          import json,os
          from datetime import date
          from pathlib import Path
          from smile2.market_brief import market_brief
          p=Path(os.environ["RUNNER_TEMP"])/"pages-test"/"daily_issues.json"
          d=json.loads(p.read_text())
          latest=max(d)
          day=date(int(latest[:4]),int(latest[4:6]),int(latest[6:]))
          r=market_brief(d,day,{})
          assert r["status"]=="available" and r["invalid_rows"]==0
          print("Selected market observations PASS",r["day"],len(r["stocks"]))
          PY
      - name: Build isolated browser preview and probe official feeds
        run: python -m smile2.pipeline --input "$RUNNER_TEMP/news.json" --output "$RUNNER_TEMP/smile-preview" --day 2026-11-26 --previous 2026-11-25 --official --media --calendar
      - name: Browser smoke test (isolated local server)
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/smile-preview" > "$RUNNER_TEMP/smile-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node tests/smile2_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: smile2-browser-preview
          path: ${{ runner.temp }}/smile-preview
          retention-days: 14
  legacy-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install exchange-calendars==4.13.2
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  live-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Capture public feeds without production writes
        run: |
          python news_feed/collect.py --output-dir "$RUNNER_TEMP/fresh" --no-brief
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"fresh"
          s=json.loads((p/"keyword_stats.json").read_text())
          rows=json.loads((p/"news.json").read_text())
          print(json.dumps({"sources_ok":s["sources_ok"],"sources_bad":s["sources_bad"],"raw_articles":s["raw_articles"],"retained":len(rows),"publication_timestamp_count":s["publication_timestamp_count"],"source_health":s["source_health"]},ensure_ascii=False))
          if not rows or not s["publication_timestamp_count"]:
              raise SystemExit("No usable publication timestamps in live capture")
          PY
          python -m smile2.news_engine --input "$RUNNER_TEMP/fresh/news.json" --output "$RUNNER_TEMP/fresh-events.json"

